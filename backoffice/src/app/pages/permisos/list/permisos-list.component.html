<ng-template appPageActions>
  <button mat-raised-button color="primary" (click)="onCreate()">
    <i class="ph ph-plus" aria-hidden="true"></i> Nuevo permiso
  </button>
</ng-template>

<div class="list-toolbar">
  <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" active="todas"></app-filter-tabs>
  <span class="list-toolbar-count">{{ (permisos$ | async)?.length || 0 }} permisos</span>
</div>

<app-shared-table
    [data]="(permisos$ | async) ?? []"
    [columns]="columns"
    [loading]="loading"
    emptyMessage="No hay permisos registrados"
    emptyIcon="key">

  <ng-template appTableCell="acciones" let-row>
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Acciones del permiso">
      <i class="ph ph-dots-three-vertical" aria-hidden="true"></i>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="onEdit(row)">
        <i class="ph ph-pencil-simple" aria-hidden="true"></i> Editar
      </button>
      <button mat-menu-item class="delete-action" (click)="onDelete(row)">
        <i class="ph ph-trash" aria-hidden="true"></i> Eliminar
      </button>
    </mat-menu>
  </ng-template>

</app-shared-table>
