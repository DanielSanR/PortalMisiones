<ng-template appPageActions>
  <button mat-raised-button color="primary" (click)="onCreate()">
    <i class="ph ph-plus" aria-hidden="true"></i> Nuevo permiso
  </button>
</ng-template>

<div class="list-toolbar">
  <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" active="todas"></app-filter-tabs>
  <span class="list-toolbar-count">{{ (permisos$ | async)?.length || 0 }} permisos</span>
</div>

<app-shared-table
    [data]="(permisos$ | async) ?? []"
    [columns]="columns"
    [loading]="loading"
    emptyMessage="No hay permisos registrados"
    emptyIcon="key">

  <ng-template appTableCell="acciones" let-row>
    <div class="row-actions">
      <button type="button" class="row-action" (click)="onEdit(row)">
        <i class="ph ph-pencil-simple" aria-hidden="true"></i> Editar
      </button>
      <button type="button" class="row-action row-action--icon row-action--danger" (click)="onDelete(row)"
              aria-label="Eliminar permiso" matTooltip="Eliminar">
        <i class="ph ph-trash" aria-hidden="true"></i>
      </button>
    </div>
  </ng-template>

</app-shared-table>
