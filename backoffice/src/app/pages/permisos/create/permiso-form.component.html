<app-loading [loading]="loading" message="Cargando..."></app-loading>

@if (!loading && loadError) {
  <!-- Sin el permiso leído no se dibuja el formulario: se vería como un alta vacía y guardar
       pisaría el permiso con lo que el usuario escribiera. -->
  <app-form-error-banner [errors]="[loadError]" titulo="No pudimos cargar el permiso"></app-form-error-banner>

  <div class="form-card">
    <div class="form-actions">
      <span class="form-actions__help">No se modificó nada.</span>
      <div class="form-actions__buttons">
        <button mat-stroked-button color="primary" type="button" (click)="goBack()">Volver a la lista</button>
        <button mat-raised-button color="primary" type="button" (click)="cargar()">
          <i class="ph ph-arrow-clockwise" aria-hidden="true"></i>
          <span>Reintentar</span>
        </button>
      </div>
    </div>
  </div>
}

@if (!loading && !loadError) {
  <div class="form-card">
    <app-dynamic-form [requireChanges]="isEdit" [fields]="config.fields!"
        [submitButtonText]="isEdit ? 'Guardar cambios' : 'Crear permiso'"
        cancelButtonText="Cancelar" [initialData]="initialData" [saving]="saving" [serverError]="serverError"
        (formSubmit)="onSubmit($event)"
        (formCancel)="goBack()">
    </app-dynamic-form>
  </div>
}
