<ng-template appPageActions>
  <button mat-raised-button color="primary" (click)="onCreate()" *appHasPermission="'CREATE_ORGANISM_TYPE'">
    <i class="ph ph-plus" aria-hidden="true"></i> Nuevo tipo
  </button>
</ng-template>

@if (vista$ | async; as vista) {
<!-- Toolbar según el diseño "Pantallas · Backoffice Misiones", pantalla LISTA:
     fila A = buscador + contador + acciones · fila B = chips de filtro. -->
<div class="list-toolbar list-toolbar--stacked">
  <div class="list-toolbar__row">
    <app-list-search
      [control]="searchCtrl"
      placeholder="Buscar por nombre o descripción…"
      ariaLabel="Buscar tipos de organismo por nombre, descripción o código">
    </app-list-search>

    <div class="tiposlist-acciones">
      <span class="list-toolbar-count">{{ vista.total }} tipos de organismo</span>
      <!-- Sin funcionalidad todavía: visibles y deshabilitados, no ocultos. -->
      <button type="button" class="tiposlist-iconbtn" disabled aria-label="Ordenar">
        <i class="ph ph-arrows-down-up" aria-hidden="true"></i>
      </button>
      <button type="button" class="tiposlist-iconbtn" disabled aria-label="Exportar a CSV">
        <i class="ph ph-download-simple" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="list-toolbar__row tiposlist-chips">
    <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" [active]="(filtro$ | async)!" (activeChange)="filtro$.next($any($event))"></app-filter-tabs>
    <button type="button" class="tiposlist-masfiltros" disabled>
      <i class="ph ph-sliders-horizontal" aria-hidden="true"></i> Más filtros
    </button>
  </div>
</div>

@if (vista.filtrosActivos.length) {
  <app-active-filters
    [filtros]="vista.filtrosActivos"
    (quitar)="quitarFiltro($event)"
    (limpiar)="limpiarFiltros()">
  </app-active-filters>
}

<app-shared-table
    [data]="vista.rows"
    [columns]="columns"
    [loading]="loading"
    [error]="error"
    errorTitle="No pudimos cargar los tipos de organismo"
    errorMessage="Revisá tu conexión e intentá de nuevo. Si sigue, avisá a Soporte."
    (retry)="load()"
    [sortable]="true"
    (sortChange)="onSortChange($event)"
    [paginated]="true"
    [totalItems]="vista.total"
    [pageIndex]="vista.pageIndex"
    [pageSize]="(pageSize$ | async)!"
    (pageChange)="onPageChange($event)"
    [emptyTitle]="vista.emptyTitle"
    [emptyMessage]="vista.emptyMessage"
    [emptyActionPermission]="vista.hayFiltros ? '' : 'CREATE_ORGANISM_TYPE'"
    [emptyActionLabel]="vista.emptyActionLabel"
    [emptyActionIcon]="vista.hayFiltros ? 'x' : 'plus'"
    (emptyAction)="onEmptyAction()"
    emptyIcon="folders">

    <ng-template appTableCell="nombre" let-row>
        <div class="tiposlist-nombre">
            <span class="tiposlist-nombre__principal">{{ row.nombre }}</span>
            <!-- En mobile la columna Descripción se oculta: acá no se pierde el dato. -->
            @if (row.descripcion) {
                <span class="tiposlist-nombre__meta">{{ row.descripcion }}</span>
            }
        </div>
    </ng-template>

    <ng-template appTableCell="descripcion" let-row>
        <span class="text-secondary">{{ row.descripcion || '—' }}</span>
    </ng-template>

    <ng-template appTableCell="activo" let-row>
        <span class="bool-badge" [class.bool-badge--active]="row.activo" [class.bool-badge--inactive]="!row.activo">
            <span class="bool-badge__dot" aria-hidden="true"></span>
            {{ row.activo ? 'Activo' : 'Inactivo' }}
        </span>
    </ng-template>

    <ng-template appTableCell="acciones" let-row>
        <app-row-actions
            [primary]="accionEditar(row)"
            [actions]="accionesDe(row)"
            [busy]="deletingId === row.id"
            busyLabel="Eliminando tipo de organismo...">
        </app-row-actions>
    </ng-template>

</app-shared-table>
}
