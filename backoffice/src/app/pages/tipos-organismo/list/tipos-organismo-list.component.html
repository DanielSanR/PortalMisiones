<ng-template appPageActions>
  <button mat-raised-button color="primary" (click)="onCreate()" *appHasPermission="'CREATE_ORGANISM_TYPE'">
    <i class="ph ph-plus" aria-hidden="true"></i> Nuevo tipo
  </button>
</ng-template>

<div class="list-toolbar">
  <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" [active]="(filtro$ | async)!" (activeChange)="filtro$.next($any($event))"></app-filter-tabs>
  <span class="list-toolbar-count">{{ (tiposFiltrados$ | async)?.length || 0 }} tipos de organismo</span>
</div>

<app-shared-table
    [data]="(tiposFiltrados$ | async) ?? []"
    [columns]="columns"
    [loading]="loading"
    emptyMessage="No hay tipos de organismo registrados"
    emptyIcon="folders">

    <ng-template appTableCell="nombre" let-row>
        <strong>{{ row.nombre }}</strong>
    </ng-template>

    <ng-template appTableCell="descripcion" let-row>
        <span class="text-secondary">{{ row.descripcion || '—' }}</span>
    </ng-template>

    <ng-template appTableCell="activo" let-row>
        <span class="bool-badge" [class.bool-badge--active]="row.activo" [class.bool-badge--inactive]="!row.activo">
            <span class="bool-badge__dot" aria-hidden="true"></span>
            {{ row.activo ? 'Activo' : 'Inactivo' }}
        </span>
    </ng-template>

    <ng-template appTableCell="acciones" let-row>
        <div class="row-actions">
            <button type="button" class="row-action" (click)="onEdit(row)" *appHasPermission="'UPDATE_ORGANISM_TYPE'">
                <i class="ph ph-pencil-simple" aria-hidden="true"></i> Editar
            </button>
            <button type="button" class="row-action row-action--icon row-action--danger" (click)="onDelete(row)"
                *appHasPermission="'DELETE_ORGANISM_TYPE'" aria-label="Eliminar tipo de organismo" matTooltip="Eliminar">
                <i class="ph ph-trash" aria-hidden="true"></i>
            </button>
        </div>
    </ng-template>

</app-shared-table>
