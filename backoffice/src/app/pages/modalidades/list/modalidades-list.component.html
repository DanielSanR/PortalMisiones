<ng-template appPageActions>
  <button mat-raised-button color="primary" (click)="onCreate()" *appHasPermission="'CREATE_MODALITY'">
    <i class="ph ph-plus" aria-hidden="true"></i> Nueva modalidad
  </button>
</ng-template>

<div class="list-toolbar">
  <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" active="todas"></app-filter-tabs>
  <span class="list-toolbar-count">{{ (modalidades$ | async)?.length || 0 }} modalidades</span>
</div>

<app-shared-table
    [data]="(modalidades$ | async) ?? []"
    [columns]="columns"
    [loading]="loading"
    emptyMessage="No hay modalidades registradas"
    emptyIcon="sliders-horizontal">

    <ng-template appTableCell="nombre" let-row>
        <strong>{{ row.nombre }}</strong>
    </ng-template>

    <ng-template appTableCell="acciones" let-row>
        <app-row-actions [primary]="accionEditar(row)" [actions]="accionesDe(row)"></app-row-actions>
    </ng-template>

</app-shared-table>
