<ng-template appPageActions>
  <button mat-raised-button color="primary" (click)="onCreate()" *appHasPermission="'CREATE_MODALITY'">
    <i class="ph ph-plus" aria-hidden="true"></i> Nueva modalidad
  </button>
</ng-template>

@if (vista$ | async; as vista) {
<!-- Toolbar según el diseño "Pantallas · Backoffice Misiones", pantalla LISTA:
     fila A = buscador + contador + acciones · fila B = chips de filtro. -->
<div class="list-toolbar list-toolbar--stacked">
  <div class="list-toolbar__row">
    <app-list-search
      [control]="searchCtrl"
      placeholder="Buscar por nombre…"
      ariaLabel="Buscar modalidades por nombre">
    </app-list-search>

    <div class="modalidadeslist-acciones">
      <span class="list-toolbar-count">{{ vista.total }} modalidades</span>
      <!-- Sin funcionalidad todavía: visibles y deshabilitados, no ocultos. -->
      <button type="button" class="modalidadeslist-iconbtn" disabled aria-label="Ordenar">
        <i class="ph ph-arrows-down-up" aria-hidden="true"></i>
      </button>
      <button type="button" class="modalidadeslist-iconbtn" disabled aria-label="Exportar a CSV">
        <i class="ph ph-download-simple" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="list-toolbar__row modalidadeslist-chips">
    <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" active="todas"></app-filter-tabs>
    <button type="button" class="modalidadeslist-masfiltros" disabled>
      <i class="ph ph-sliders-horizontal" aria-hidden="true"></i> Más filtros
    </button>
  </div>
</div>

@if (vista.filtrosActivos.length) {
  <app-active-filters
    [filtros]="vista.filtrosActivos"
    (quitar)="quitarFiltro($event)"
    (limpiar)="limpiarFiltros()">
  </app-active-filters>
}

<app-shared-table
    [data]="vista.rows"
    [columns]="columns"
    [loading]="loading"
    [error]="error"
    errorTitle="No pudimos cargar las modalidades"
    errorMessage="Revisá tu conexión e intentá de nuevo. Si sigue, avisá a Soporte."
    (retry)="load()"
    [sortable]="true"
    (sortChange)="onSortChange($event)"
    [paginated]="true"
    [totalItems]="vista.total"
    [pageIndex]="vista.pageIndex"
    [pageSize]="(pageSize$ | async)!"
    (pageChange)="onPageChange($event)"
    [emptyTitle]="vista.emptyTitle"
    [emptyMessage]="vista.emptyMessage"
    [emptyActionPermission]="vista.hayFiltros ? '' : 'CREATE_MODALITY'"
    [emptyActionLabel]="vista.emptyActionLabel"
    [emptyActionIcon]="vista.hayFiltros ? 'x' : 'plus'"
    (emptyAction)="onEmptyAction()"
    emptyIcon="sliders-horizontal">

    <ng-template appTableCell="nombre" let-row>
        <span class="modalidadeslist-nombre">{{ row.nombre }}</span>
    </ng-template>

    <ng-template appTableCell="acciones" let-row>
        <app-row-actions
            [primary]="accionEditar(row)"
            [actions]="accionesDe(row)"
            [busy]="deletingId === row.id"
            busyLabel="Eliminando modalidad...">
        </app-row-actions>
    </ng-template>

</app-shared-table>
}
