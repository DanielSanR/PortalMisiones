<ng-template appPageActions>
  <button mat-raised-button color="primary" (click)="onCreate()" *appHasPermission="'CREATE_LIFE_EVENT'">
    <i class="ph ph-plus" aria-hidden="true"></i> Nuevo evento
  </button>
</ng-template>

@if (vista$ | async; as vista) {
<!-- Toolbar según el diseño "Pantallas · Backoffice Misiones", pantalla LISTA:
     fila A = buscador + contador + acciones · fila B = chips de filtro. -->
<div class="list-toolbar list-toolbar--stacked">
  <div class="list-toolbar__row">
    <app-list-search
      [control]="searchCtrl"
      placeholder="Buscar por nombre o slug…"
      ariaLabel="Buscar eventos de vida por nombre o slug">
    </app-list-search>

    <div class="list-toolbar__actions">
      <span class="list-toolbar-count" aria-live="polite">{{ vista.total }} eventos de vida</span>
      <!-- Sin funcionalidad todavía: visibles con `appUnavailable` (motivo en tooltip), no ocultos. -->
      <button type="button" class="list-iconbtn" appUnavailable="Usá los encabezados de la tabla para ordenar; el orden avanzado todavía no está disponible"
              aria-label="Ordenar">
        <i class="ph ph-arrows-down-up" aria-hidden="true"></i>
      </button>
      <button type="button" class="list-iconbtn" appUnavailable="La exportación a CSV se habilita cuando el backend ofrezca el endpoint"
              aria-label="Exportar a CSV">
        <i class="ph ph-download-simple" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="list-toolbar__row list-toolbar__row--chips">
    <!-- Chip único "Todas": el modelo no tiene ningún campo por el que segmentar. -->
    <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" active="todas"></app-filter-tabs>
    <button type="button" class="list-ghost-button" appUnavailable="Se habilita cuando haya más campos por los que filtrar">
      <i class="ph ph-sliders-horizontal" aria-hidden="true"></i> Más filtros
    </button>
  </div>
</div>

@if (vista.filtrosActivos.length) {
  <app-active-filters
    [filtros]="vista.filtrosActivos"
    (quitar)="quitarFiltro($event)"
    (limpiar)="limpiarFiltros()">
  </app-active-filters>
}

<app-shared-table
    [data]="vista.rows"
    [columns]="columns"
    [loading]="loading"
    [error]="error"
    errorTitle="No pudimos cargar los eventos de vida"
    errorMessage="Revisá tu conexión e intentá de nuevo. Si sigue, avisá a Soporte."
    (retry)="load()"
    [sortable]="true"
    (sortChange)="onSortChange($event)"
    [paginated]="true"
    [totalItems]="vista.total"
    [pageIndex]="vista.pageIndex"
    [pageSize]="(pageSize$ | async)!"
    (pageChange)="onPageChange($event)"
    [emptyTitle]="vista.emptyTitle"
    [emptyMessage]="vista.emptyMessage"
    [emptyActionPermission]="vista.hayFiltros ? '' : 'CREATE_LIFE_EVENT'"
    [emptyActionLabel]="vista.emptyActionLabel"
    [emptyActionIcon]="vista.hayFiltros ? 'x' : 'plus'"
    (emptyAction)="onEmptyAction()"
    emptyIcon="calendar-x">

    <ng-template appTableCell="nombre" let-row>
        <div class="cell-name">
            <span class="cell-name__principal">{{ row.nombre }}</span>
            <!-- En mobile la columna Slug se oculta: acá no se pierde el dato. -->
            <span class="cell-name__meta">{{ row.slug }}</span>
        </div>
    </ng-template>

    <ng-template appTableCell="slug" let-row>
        <span class="eventoslist-slug">{{ row.slug }}</span>
    </ng-template>

    <ng-template appTableCell="acciones" let-row>
        <app-row-actions
            [primary]="accionEditar(row)"
            [actions]="accionesDe(row)"
            [busy]="deletingId === row.id"
            busyLabel="Eliminando evento de vida...">
        </app-row-actions>
    </ng-template>

</app-shared-table>
}
