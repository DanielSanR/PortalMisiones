<ng-template appPageActions>
  <button mat-raised-button color="primary" (click)="onCreate()" *appHasPermission="'CREATE_LIFE_EVENT'">
    <i class="ph ph-plus" aria-hidden="true"></i> Nuevo evento
  </button>
</ng-template>

<div class="list-toolbar">
  <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" active="todas"></app-filter-tabs>
  <span class="list-toolbar-count">{{ (eventos$ | async)?.length || 0 }} eventos de vida</span>
</div>

<app-shared-table
    [data]="(eventos$ | async) ?? []"
    [columns]="columns"
    [loading]="loading"
    emptyMessage="No hay eventos de vida registrados"
    emptyIcon="calendar-x">

    <ng-template appTableCell="nombre" let-row>
        <strong class="evento-nombre">{{ row.nombre }}</strong>
    </ng-template>

    <ng-template appTableCell="slug" let-row>
        <span class="text-secondary">{{ row.slug }}</span>
    </ng-template>

    <ng-template appTableCell="acciones" let-row>
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Acciones">
            <i class="ph ph-dots-three-vertical" aria-hidden="true"></i>
        </button>
        <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onEdit(row)" *appHasPermission="'UPDATE_LIFE_EVENT'">
                <i class="ph ph-pencil-simple" aria-hidden="true"></i> Editar
            </button>
            <button mat-menu-item class="delete-action" (click)="onDelete(row)" *appHasPermission="'DELETE_LIFE_EVENT'">
                <i class="ph ph-trash" aria-hidden="true"></i> Eliminar
            </button>
        </mat-menu>
    </ng-template>

</app-shared-table>
