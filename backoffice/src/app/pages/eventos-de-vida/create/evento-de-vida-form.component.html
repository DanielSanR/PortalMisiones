<div class="form-card">
    <app-dynamic-form
        [fields]="config.fields!"
        [submitButtonText]="isEdit ? 'Guardar cambios' : 'Crear evento de vida'"
        cancelButtonText="Cancelar"
        [initialData]="initialData"
        [saving]="saving"
        (formSubmit)="onSubmit($event)"
        (formCancel)="goBack()">
    </app-dynamic-form>
</div>
