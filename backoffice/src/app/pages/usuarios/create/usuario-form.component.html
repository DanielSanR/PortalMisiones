<app-loading [loading]="loading" message="Cargando..."></app-loading>

@if (!loading && loadError) {
  <!-- Sin roles ni organismos el formulario no se puede completar: se muestra el motivo
       y una salida, en vez de un alta vacía que iba a fallar al guardar. -->
  <app-form-error-banner [errors]="[loadError]" [titulo]="edicionNoDisponible ? 'Edición no disponible' : 'No pudimos cargar el formulario'"></app-form-error-banner>

  <div class="form-card">
    <div class="form-actions">
      @if (edicionNoDisponible) {
        <span class="form-actions__help">Desde la lista podés cambiar el email, la contraseña o el estado de la cuenta.</span>
      } @else {
        <span class="form-actions__help">Los datos de roles y organismos no respondieron.</span>
      }
      <div class="form-actions__buttons">
        <button mat-stroked-button color="primary" type="button" (click)="goBack()">Volver a la lista</button>
        @if (!edicionNoDisponible) {
          <button mat-raised-button color="primary" type="button" (click)="reintentar()">
            <i class="ph ph-arrow-clockwise" aria-hidden="true"></i>
            <span>Reintentar</span>
          </button>
        }
      </div>
    </div>
  </div>
}

@if (!loading && !loadError) {
  <!-- El formulario nace con los catálogos y el usuario ya leídos. `(valueChanges)` avisa el
       cambio de rol: la página recalcula `fields` para mostrar u ocultar "Organismo". -->
  <div class="form-card">
    <app-dynamic-form [requireChanges]="isEdit" [fields]="fields"
        [submitButtonText]="isEdit ? 'Guardar cambios' : 'Crear usuario'"
        cancelButtonText="Cancelar" [initialData]="initialData" [saving]="saving" [serverError]="serverError"
        (valueChanges)="onValueChanges($event)"
        (formSubmit)="onSubmit($event)"
        (formCancel)="goBack()">
    </app-dynamic-form>
  </div>
}
