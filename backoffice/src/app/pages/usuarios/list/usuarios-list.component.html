<ng-template appPageActions>
    <button *appHasPermission="'CREATE_USER'" mat-raised-button color="primary" (click)="onCreate()">
        <i class="ph ph-user-plus" aria-hidden="true"></i> Nuevo usuario
    </button>
</ng-template>

<div class="list-toolbar">
    <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" [active]="(filtro$ | async)!" (activeChange)="filtro$.next($any($event))"></app-filter-tabs>
    <span class="list-toolbar-count">{{ (usuariosFiltrados$ | async)?.length || 0 }} usuarios</span>
</div>

<app-shared-table
    [data]="(usuariosFiltrados$ | async) ?? []"
    [columns]="columns"
    [loading]="loading"
    emptyMessage="No se encontraron usuarios">

    <!-- Columna: Nombre completo -->
    <ng-template appTableCell="nombre" let-row>
        {{ row.nombre }} {{ row.apellido }}
    </ng-template>

    <!-- Columna: Rol (con pipe de etiqueta) -->
    <ng-template appTableCell="rol" let-row>
        {{ row.rol | rolLabel }}
    </ng-template>

    <!-- Columna: Organismo -->
    <ng-template appTableCell="organismo" let-row>
        {{ row.organismoNombre || '-' }}
    </ng-template>

    <!-- Columna: Acciones -->
    <ng-template appTableCell="acciones" let-row>
        <div class="row-actions">
            <button *appHasPermission="'UPDATE_USER'" type="button" class="row-action" (click)="onEdit(row)">
                <i class="ph ph-pencil-simple" aria-hidden="true"></i> Editar
            </button>
        </div>
    </ng-template>

</app-shared-table>
