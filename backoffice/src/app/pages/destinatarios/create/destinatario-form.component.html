<app-page-header [title]="isEdit ? 'Editar destinatario' : 'Nuevo destinatario'" [showBack]="true"
    (back)="goBack()"></app-page-header>

<div class="form-card">
    <app-dynamic-form [fields]="config.fields!" [submitButtonText]="isEdit ? 'Guardar cambios' : 'Crear destinatario'"
        cancelButtonText="Cancelar" [initialData]="initialData" [saving]="saving" (formSubmit)="onSubmit($event)"
        (formCancel)="goBack()">
    </app-dynamic-form>
</div>
