<ng-template appPageActions>
  @if (hasFilters()) {
    <button mat-stroked-button (click)="clearFilters()">
      <i class="ph ph-x-circle" aria-hidden="true"></i> Limpiar filtros
    </button>
  }
</ng-template>

<!-- Toolbar de lista (well): fila A = búsqueda/select reales + contador · fila B = filter-tabs (única, informativa). -->
<div class="list-toolbar list-toolbar--stacked">
  <form [formGroup]="filterForm" class="list-toolbar__row">
    <mat-form-field appearance="outline" class="filter-search">
      <mat-label>Buscar</mat-label>
      <input matInput formControlName="search" placeholder="Trámite o usuario...">
      <i class="ph ph-magnifying-glass" matPrefix aria-hidden="true"></i>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-select">
      <mat-label>Acción</mat-label>
      <mat-select formControlName="accion">
        <mat-option value="">Todas</mat-option>
        @for (a of acciones; track a.value) {
          <mat-option [value]="a.value">{{ a.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <span class="list-toolbar-count">{{ totalItems }} registros</span>
  </form>

  <div class="list-toolbar__row">
    <app-filter-tabs [tabs]="[{ value: 'todas', label: 'Todas', count: totalItems }]" active="todas"></app-filter-tabs>
  </div>
</div>

<app-shared-table
    [data]="registros"
    [columns]="columns"
    [loading]="loading"
    [paginated]="true"
    [totalItems]="totalItems"
    [pageSize]="pageSize"
    [pageIndex]="currentPage"

    emptyMessage="No se encontraron registros de auditoría"
    emptyIcon="clock-counter-clockwise"
    (pageChange)="onPageChange($event)">

    <ng-template appTableCell="accion" let-row>
        <span class="accion-chip"
            [style.color]="row.accion | accionLabel:'color'"
            [style.borderColor]="row.accion | accionLabel:'color'">
            <i class="ph ph-{{ row.accion | accionLabel:'icon' }} accion-icon"
                [style.color]="row.accion | accionLabel:'color'" aria-hidden="true"></i>
            {{ row.accion | accionLabel }}
        </span>
    </ng-template>

    <ng-template appTableCell="tramite" let-row>
        <strong>{{ row.tramiteTitulo }}</strong>
    </ng-template>

    <ng-template appTableCell="usuario" let-row>
        {{ row.usuarioNombre }}
    </ng-template>

    <ng-template appTableCell="fecha" let-row>
        {{ row.fechaAccion | date:'dd/MM/yyyy HH:mm' }}
    </ng-template>

    <ng-template appTableCell="detalle" let-row>
        <button mat-icon-button matTooltip="Ver detalle de cambios" (click)="onViewDetail(row)">
            <i class="ph ph-eye" aria-hidden="true"></i>
        </button>
    </ng-template>

</app-shared-table>
