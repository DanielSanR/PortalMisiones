<ng-template appPageActions>
  <button *appHasPermission="'CREATE_TAXONOMY'" mat-raised-button color="primary" (click)="onCreate()">
    <i class="ph ph-plus" aria-hidden="true"></i> Nueva etiqueta
  </button>
</ng-template>

<div class="list-toolbar">
  <app-filter-tabs [tabs]="(filterTabs$ | async) ?? []" active="todas"></app-filter-tabs>
  <span class="list-toolbar-count">{{ (etiquetas$ | async)?.length || 0 }} etiquetas</span>
</div>

<app-shared-table
    [data]="(etiquetas$ | async) ?? []"
    [columns]="columns"
    [loading]="loading"
    emptyMessage="No hay etiquetas registradas"
    emptyIcon="bookmarks-simple">

    <ng-template appTableCell="nombre" let-row>
        <div class="etiqueta-name">
            <mat-icon class="etiqueta-icon" [style.color]="row.color">{{ row.icono }}</mat-icon>
            <strong>{{ row.nombre }}</strong>
        </div>
    </ng-template>

    <ng-template appTableCell="tramitesCount" let-row>
        <strong class="count-badge">{{ row.tramitesCount || 0 }}</strong>
    </ng-template>

    <ng-template appTableCell="acciones" let-row>
        <app-row-actions [primary]="accionEditar(row)" [actions]="accionesDe(row)"></app-row-actions>
    </ng-template>

</app-shared-table>
