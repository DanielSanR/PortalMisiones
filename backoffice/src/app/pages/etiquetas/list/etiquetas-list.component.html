<app-page-header title="Etiquetas" subtitle="Gestión de etiquetas para clasificar trámites">
  <button mat-raised-button color="primary" (click)="onCreate()">
    <mat-icon>add</mat-icon> Nueva etiqueta
  </button>
</app-page-header>

<app-shared-table
    [data]="etiquetas"
    [columns]="columns"
    [loading]="loading"
    emptyMessage="No hay etiquetas registradas"
    emptyIcon="label_off">

    <ng-template appTableCell="color" let-row>
        <span class="color-dot" [style.background]="row.color"></span>
    </ng-template>

    <ng-template appTableCell="nombre" let-row>
        <div class="etiqueta-name">
            <mat-icon class="etiqueta-icon" [style.color]="row.color">{{ row.icono }}</mat-icon>
            <strong>{{ row.nombre }}</strong>
        </div>
    </ng-template>

    <ng-template appTableCell="categoria" let-row>
        <span class="categoria-chip" [class.categoria-perfil]="row.categoria === 'Perfil'">
            {{ row.categoria }}
        </span>
    </ng-template>

    <ng-template appTableCell="tramitesCount" let-row>
        <span class="count-badge">{{ row.tramitesCount || 0 }}</span>
    </ng-template>

    <ng-template appTableCell="acciones" let-row>
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Acciones">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onEdit(row)">
                <mat-icon>edit</mat-icon> Editar
            </button>
            <button mat-menu-item class="delete-action" (click)="onDelete(row)">
                <mat-icon>delete</mat-icon> Eliminar
            </button>
        </mat-menu>
    </ng-template>

</app-shared-table>
