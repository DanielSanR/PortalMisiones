    <app-page-header title="Organismos" subtitle="Gestión de organismos provinciales">
      <button mat-raised-button color="primary" (click)="onCreate()">
        <mat-icon>add</mat-icon> Nuevo organismo
      </button>
    </app-page-header>

    <app-loading [loading]="loading" message="Cargando organismos..."></app-loading>

    <div class="table-container" *ngIf="!loading">
      <table mat-table [dataSource]="organismos" class="full-width">
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let row">
            <strong>{{ row.nombre }}</strong>
            <small *ngIf="row.sigla" class="text-secondary"> ({{ row.sigla }})</small>
          </td>
        </ng-container>

        <ng-container matColumnDef="sitioWeb">
          <th mat-header-cell *matHeaderCellDef>Sitio web</th>
          <td mat-cell *matCellDef="let row">
            <a *ngIf="row.sitioWeb" [href]="row.sitioWeb" target="_blank" rel="noopener">{{ row.sitioWeb }}</a>
            <span *ngIf="!row.sitioWeb" class="text-secondary">-</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="onEdit(row)">
                <mat-icon>edit</mat-icon> Editar
              </button>
              <button mat-menu-item class="delete-action" (click)="onDelete(row)">
                <mat-icon>delete</mat-icon> Eliminar
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['nombre', 'sitioWeb', 'acciones']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['nombre', 'sitioWeb', 'acciones']"></tr>
      </table>
    </div>
