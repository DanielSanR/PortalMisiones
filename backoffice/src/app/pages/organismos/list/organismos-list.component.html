<app-page-header title="Organismos" subtitle="Gestión de organismos provinciales">
  <button mat-raised-button color="primary" (click)="onCreate()" *appHasPermission="'CREATE_ORGANISM'">
    <mat-icon>add</mat-icon> Nuevo organismo
  </button>
</app-page-header>

<app-shared-table
    [data]="(organismos$ | async) ?? []"
    [columns]="columns"
    [loading]="loading"
    emptyMessage="No hay organismos registrados"
    emptyIcon="business">

    <ng-template appTableCell="nombre" let-row>
        <strong>{{ row.nombre }}</strong>
    </ng-template>

    <ng-template appTableCell="acronym" let-row>
        <span class="text-secondary">{{ row.acronym || '—' }}</span>
    </ng-template>

    <ng-template appTableCell="tipoNombre" let-row>
        <span class="text-secondary">{{ row.tipoNombre || '—' }}</span>
    </ng-template>

    <ng-template appTableCell="activo" let-row>
        <span class="text-secondary">{{ row.activo ? 'Sí' : 'No' }}</span>
    </ng-template>

    <ng-template appTableCell="acciones" let-row>
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Acciones">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onEdit(row)" *appHasPermission="'UPDATE_ORGANISM'">
                <mat-icon>edit</mat-icon> Editar
            </button>
            <button mat-menu-item class="delete-action" (click)="onDelete(row)" *appHasPermission="'DELETE_ORGANISM'">
                <mat-icon>delete</mat-icon> Eliminar
            </button>
        </mat-menu>
    </ng-template>

</app-shared-table>
