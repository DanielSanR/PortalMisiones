<app-page-header [title]="isEdit ? 'Editar categoría' : 'Nueva categoría'" [showBack]="true"
    (back)="goBack()"></app-page-header>
 

  @if(config){
  <div class="form-card">
    <app-dynamic-form [fields]="config.fields!" [submitButtonText]="isEdit ? 'Guardar cambios' : 'Crear categoría'"
        cancelButtonText="Cancelar" [initialData]="initialData" [saving]="saving" (formSubmit)="onSubmit($event)"
        (formCancel)="goBack()">
    </app-dynamic-form>
  </div>
  }
