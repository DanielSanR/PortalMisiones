<!-- El `aria-label` reemplaza al contenido: lleva nombre, rol y organismo (si no, el rol no llega a un lector de
     pantalla). Contraída, solo se ve el avatar: el mismo texto va de tooltip a la derecha, como los ítems del menú
     lateral (al ser idéntico al nombre accesible, el tooltip no se agrega además como descripción). -->
<button type="button"
    class="user-menu__trigger"
    [class.is-compact]="compact"
    [matMenuTriggerFor]="menu"
    [attr.aria-label]="nombreAccesible"
    [matTooltip]="compact ? nombreAccesible : ''"
    matTooltipPosition="right">
    <span class="user-menu__avatar" aria-hidden="true">{{ initials }}</span>
    <span class="user-menu__info" [class.cdk-visually-hidden]="compact">
        <span class="user-menu__name">{{ name }}</span>
        <span class="user-menu__role">{{ role }}</span>
    </span>
    @if (!compact) {
        <i class="ph ph-dots-three-vertical user-menu__arrow" aria-hidden="true"></i>
    }
</button>

<mat-menu #menu="matMenu" class="user-menu-panel" xPosition="after" yPosition="above">
    <!-- Ficha de la cuenta: solo se lee. El rol no se repite acá: ya está en el disparador (nombre + rol).
         `mat-menu` se cierra con cualquier click que llegue al panel, así que
         se frena UNA vez acá (no en cada fila) para poder seleccionar y copiar el email o el organismo sin
         que el menú se cierre. No es un control: no tiene rol, foco ni teclado. -->
    <div class="user-menu__cuenta" (click)="$event.stopPropagation()">
        <div class="user-menu__header">
            <span class="user-menu__avatar user-menu__avatar--lg" aria-hidden="true">{{ initials }}</span>
            <div class="user-menu__header-info">
                <strong>{{ name }}</strong>
                <span class="user-menu__email">{{ email }}</span>
            </div>
        </div>
        @if (organismo) {
            <div class="user-menu__dato">
                <span class="user-menu__dato-label">Organismo</span>
                <span class="user-menu__dato-valor">{{ organismo }}</span>
            </div>
        }
    </div>
    <div class="user-menu__actions">
        <button mat-menu-item class="user-menu__item" appUnavailable="Mi perfil: todavía no está disponible">
            <i class="ph ph-user-circle" aria-hidden="true"></i>
            <span>Mi perfil</span>
        </button>
        <button mat-menu-item class="user-menu__item" appUnavailable="Cambiar contraseña: todavía no está disponible">
            <i class="ph ph-lock-simple" aria-hidden="true"></i>
            <span>Cambiar contraseña</span>
        </button>
        <button mat-menu-item class="user-menu__item" appUnavailable="El idioma es fijo: español (Argentina)">
            <i class="ph ph-globe" aria-hidden="true"></i>
            <span>Idioma</span>
            <span class="user-menu__item-value">es-AR</span>
        </button>
        <!-- Interruptor (WCAG 2.1.4): ítem `menuitemcheckbox`; el click no cierra el menú para ver el cambio. -->
        <button mat-menu-item class="user-menu__item" role="menuitemcheckbox"
            [attr.aria-checked]="atajosHabilitados"
            (click)="alternarAtajos($event)">
            <i class="ph ph-keyboard" aria-hidden="true"></i>
            <span>Atajos de teclado</span>
            <span class="user-menu__item-value">{{ atajosHabilitados ? 'Activados' : 'Desactivados' }}</span>
        </button>
    </div>
    <mat-divider></mat-divider>
    <div class="user-menu__actions">
        <button mat-menu-item class="user-menu__item user-menu__item--danger" (click)="logout.emit()">
            <i class="ph ph-sign-out" aria-hidden="true"></i>
            <span>Cerrar sesión</span>
        </button>
    </div>
</mat-menu>
