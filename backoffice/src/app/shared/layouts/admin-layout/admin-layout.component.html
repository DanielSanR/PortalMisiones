<div class="admin-layout">
    <a class="admin-layout__skip-link" href="#contenido" (click)="irAlContenido($event)">Saltar al contenido</a>

    <mat-sidenav-container class="admin-layout__shell" autosize>
        <mat-sidenav #sidenav
            [mode]="isMobile ? 'over' : 'side'"
            [opened]="!isMobile"
            [disableClose]="!isMobile"
            (keydown.escape)="alEscapeEnMenu()"
            class="admin-layout__sidenav"
            [class.admin-layout__sidenav--mini]="isCollapsed && !isMobile"
            [style.width]="isMobile ? null : (isCollapsed ? 'var(--theme-sidebar-collapsed-width)' : 'var(--theme-sidebar-width)')"
            role="complementary"
            aria-label="Barra lateral">

            <div class="admin-layout__logo">
                <span class="admin-layout__logo-mark" aria-hidden="true">M</span>
                <span class="admin-layout__logo-text">
                    <span class="admin-layout__logo-name">Misiones</span>
                    <span class="admin-layout__logo-sub">Backoffice de trámites</span>
                </span>
                <button type="button"
                    class="admin-layout__collapse-btn"
                    *ngIf="!isMobile"
                    (click)="toggleCollapse()"
                    [attr.aria-expanded]="!isCollapsed"
                    [attr.aria-label]="isCollapsed ? 'Expandir navegación' : 'Colapsar navegación'"
                    [matTooltip]="isCollapsed ? 'Expandir navegación' : 'Colapsar navegación'"
                    matTooltipPosition="right">
                    <i class="ph ph-sidebar" aria-hidden="true"></i>
                </button>
            </div>

            <app-sidebar-nav
                [grupos]="accessibleGroups"
                [authz]="authz"
                [colapsado]="isCollapsed"
                (ejecutar)="ejecutar($event)"
                (navegado)="cerrarMenuEnMobile()" />

            <div class="admin-layout__footer">
                <!-- Ruta de `pages/preferencias/preferencias.rutas.ts` (RUTA_PREFERENCIAS): `shared/` no puede importar de `pages/`. -->
                <a class="admin-layout__footer-item"
                    routerLink="/dashboard/preferencias"
                    routerLinkActive="is-active"
                    #rlaPreferencias="routerLinkActive"
                    [attr.aria-current]="rlaPreferencias.isActive ? 'page' : null"
                    [matTooltip]="isCollapsed && !isMobile ? 'Preferencias' : ''"
                    matTooltipPosition="right"
                    (click)="cerrarMenuEnMobile()">
                    <i class="ph ph-sliders-horizontal" aria-hidden="true"></i>
                    <span class="admin-layout__footer-label">Preferencias</span>
                </a>
                <button type="button" class="admin-layout__footer-item" appUnavailable="Ayuda y documentación: todavía no está disponible">
                    <i class="ph ph-question" aria-hidden="true"></i>
                    <span class="admin-layout__footer-label">Ayuda y documentación</span>
                </button>

                <app-user-menu
                    [name]="userName"
                    [email]="userEmail"
                    [initials]="userInitials"
                    [role]="userRoleSpanish"
                    [organismo]="userOrganismo"
                    [compact]="isCollapsed && !isMobile"
                    [atajosHabilitados]="(atajos.habilitados$ | async) ?? true"
                    (atajosChange)="atajos.setHabilitados($event)"
                    (logout)="logout()" />
            </div>
        </mat-sidenav>

        <mat-sidenav-content class="admin-layout__content">
            <header class="admin-layout__header">
                <!-- Trigger solo-mobile: en desktop el colapso vive únicamente en el sidenav (logo). -->
                <button type="button"
                    class="admin-layout__icon-btn admin-layout__mobile-nav-btn"
                    *ngIf="isMobile"
                    (click)="sidenav.toggle()"
                    [attr.aria-expanded]="sidenav.opened"
                    aria-label="Menú de navegación"
                    matTooltip="Menú">
                    <i class="ph" [class.ph-x]="sidenav.opened" [class.ph-list]="!sidenav.opened" aria-hidden="true"></i>
                </button>

                <app-breadcrumb [secciones]="seccionesVisibles" />

                <span class="admin-layout__header-spacer"></span>

                <button type="button"
                    class="admin-layout__icon-btn"
                    aria-label="Notificaciones"
                    appUnavailable="Las notificaciones llegan en una próxima versión">
                    <i class="ph ph-bell" aria-hidden="true"></i>
                </button>

                <div class="admin-layout__header-actions">
                    <ng-container *ngTemplateOutlet="chrome.actions$ | async"></ng-container>
                </div>
            </header>

            <main id="contenido" #mainContent class="admin-layout__page" tabindex="-1">
                <div class="admin-layout__panel">
                    <router-outlet></router-outlet>
                </div>
            </main>

            <app-footer />
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
