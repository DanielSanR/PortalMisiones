<div class="admin-layout">
    <mat-sidenav-container class="admin-layout__shell" autosize>
        <mat-sidenav #sidenav
            [mode]="isMobile ? 'over' : 'side'"
            [opened]="!isMobile"
            class="admin-layout__sidenav"
            [class.admin-layout__sidenav--mini]="isCollapsed && !isMobile"
            [style.width]="isMobile ? null : (isCollapsed ? 'var(--theme-sidebar-collapsed-width)' : 'var(--theme-sidebar-width)')"
            role="navigation"
            aria-label="Menú principal">

            <div class="admin-layout__logo">
                <span class="admin-layout__logo-mark" aria-hidden="true">M</span>
                <span class="admin-layout__logo-text">
                    <span class="admin-layout__logo-name">Misiones</span>
                    <span class="admin-layout__logo-sub">Backoffice de trámites</span>
                </span>
                <button type="button"
                    class="admin-layout__collapse-btn"
                    *ngIf="!isMobile"
                    (click)="toggleCollapse()"
                    [attr.aria-expanded]="!isCollapsed"
                    [attr.aria-label]="isCollapsed ? 'Expandir navegación' : 'Colapsar navegación'"
                    [matTooltip]="isCollapsed ? 'Expandir navegación' : 'Colapsar navegación'"
                    matTooltipPosition="right">
                    <i class="ph ph-sidebar" aria-hidden="true"></i>
                </button>
            </div>

            <div class="admin-layout__search-wrap">
                <div class="admin-layout__search">
                    <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                    <input type="search"
                        #searchInput
                        class="admin-layout__search-input"
                        placeholder="Buscar o ejecutar…"
                        aria-label="Buscar secciones y acciones"
                        role="combobox"
                        aria-autocomplete="list"
                        [attr.aria-expanded]="resultados.length > 0"
                        [attr.aria-activedescendant]="indiceActivo >= 0 ? 'resultado-' + indiceActivo : null"
                        [value]="searchQuery"
                        (input)="onSearchInput($any($event.target).value)"
                        (keydown)="onSearchKeydown($event)" />
                    <kbd class="admin-layout__search-kbd" aria-hidden="true">/</kbd>
                </div>

                <!-- Panel de resultados: navegación primero, después las acciones. -->
                <div class="admin-layout__resultados" *ngIf="resultados.length > 0" role="listbox">
                    <ng-container *ngFor="let r of resultados; let i = index">
                        <span class="admin-layout__resultados-titulo" *ngIf="i === 0 && r.tipo === 'nav'">Ir a</span>
                        <span class="admin-layout__resultados-titulo" *ngIf="i === cantidadNavegacion && r.tipo === 'comando'">Acciones</span>
                        <button type="button"
                            class="admin-layout__resultado"
                            [id]="'resultado-' + i"
                            role="option"
                            [attr.aria-selected]="i === indiceActivo"
                            [class.is-active]="i === indiceActivo"
                            (mouseenter)="indiceActivo = i"
                            (click)="ejecutar(r)">
                            <i class="ph ph-{{ r.icon }}" aria-hidden="true"></i>
                            <span class="admin-layout__resultado-label">{{ r.label }}</span>
                            <i class="ph ph-arrow-elbow-down-left admin-layout__resultado-enter" aria-hidden="true"
                               *ngIf="i === indiceActivo"></i>
                        </button>
                    </ng-container>
                </div>
            </div>

            <nav class="admin-layout__nav" aria-label="Secciones del backoffice">
                <div class="admin-layout__nav-group" *ngFor="let group of navGroups; trackBy: trackByGroup">
                    <button type="button"
                        class="admin-layout__nav-group-header"
                        (click)="toggleGroup(group.label)"
                        [attr.aria-expanded]="group.isOpen"
                        [attr.aria-label]="'Sección ' + group.label">
                        <span class="admin-layout__nav-group-label">{{ group.label }}</span>
                        <i class="ph admin-layout__nav-group-chev" [class.ph-caret-down]="group.isOpen" [class.ph-caret-right]="!group.isOpen" aria-hidden="true"></i>
                    </button>

                    <div class="admin-layout__nav-group-items" *ngIf="group.isOpen">
                        <a class="admin-layout__nav-item"
                            *ngFor="let item of group.items; trackBy: trackByRoute"
                            [routerLink]="item.route"
                            routerLinkActive="is-active"
                            #rla="routerLinkActive"
                            [attr.aria-current]="rla.isActive ? 'page' : null"
                            [matTooltip]="isCollapsed ? item.label : ''"
                            matTooltipPosition="right"
                            (click)="isMobile && sidenav.close()">
                            <i class="ph ph-{{ item.icon }} admin-layout__nav-icon" aria-hidden="true"></i>
                            <span class="admin-layout__nav-label">{{ item.label }}</span>
                        </a>
                    </div>
                </div>

                <p class="admin-layout__nav-empty" *ngIf="searchQuery && navGroups.length === 0">
                    Sin resultados para "{{ searchQuery }}".
                </p>
            </nav>

            <div class="admin-layout__footer">
                <div class="admin-layout__footer-item is-disabled" aria-disabled="true" [matTooltip]="isCollapsed ? 'Preferencias' : ''" matTooltipPosition="right">
                    <i class="ph ph-sliders-horizontal" aria-hidden="true"></i>
                    <span>Preferencias</span>
                </div>
                <div class="admin-layout__footer-item is-disabled" aria-disabled="true" [matTooltip]="isCollapsed ? 'Ayuda y documentación' : ''" matTooltipPosition="right">
                    <i class="ph ph-question" aria-hidden="true"></i>
                    <span>Ayuda y documentación</span>
                </div>

                <button type="button"
                    class="admin-layout__profile"
                    [matMenuTriggerFor]="profileMenu"
                    [attr.aria-label]="'Menú de perfil: ' + userName">
                    <span class="admin-layout__avatar">{{ userInitials }}</span>
                    <span class="admin-layout__profile-info">
                        <span class="admin-layout__profile-name">{{ userName }}</span>
                        <span class="admin-layout__profile-role">{{ userRoleSpanish }}</span>
                    </span>
                    <i class="ph ph-dots-three-vertical admin-layout__profile-arrow" aria-hidden="true"></i>
                </button>

                <mat-menu #profileMenu="matMenu" class="admin-layout__user-menu" xPosition="after" yPosition="above">
                    <div class="user-menu-header" (click)="$event.stopPropagation()">
                        <span class="user-menu-avatar">{{ userInitials }}</span>
                        <div class="user-menu-info">
                            <strong>{{ userName }}</strong>
                            <span class="user-menu-email">{{ userEmail }}</span>
                        </div>
                    </div>
                    <div class="user-menu-role" (click)="$event.stopPropagation()">
                        <span class="user-menu-role__label">Rol</span>
                        <span class="user-menu-role__badge">
                            <i class="ph ph-shield-star" aria-hidden="true"></i>
                            {{ userRoleSpanish }}
                        </span>
                    </div>
                    <div class="user-menu-actions">
                        <button mat-menu-item class="user-menu-item" [disabled]="true">
                            <i class="ph ph-user-circle" aria-hidden="true"></i>
                            <span>Mi perfil</span>
                        </button>
                        <button mat-menu-item class="user-menu-item" [disabled]="true">
                            <i class="ph ph-lock-simple" aria-hidden="true"></i>
                            <span>Cambiar contraseña</span>
                        </button>
                        <button mat-menu-item class="user-menu-item" [disabled]="true">
                            <i class="ph ph-sliders-horizontal" aria-hidden="true"></i>
                            <span>Preferencias</span>
                        </button>
                    </div>
                    <mat-divider></mat-divider>
                    <button mat-menu-item class="user-menu-item user-menu-item--danger" (click)="logout()">
                        <i class="ph ph-sign-out" aria-hidden="true"></i>
                        <span>Cerrar sesión</span>
                    </button>
                </mat-menu>
            </div>
        </mat-sidenav>

        <mat-sidenav-content class="admin-layout__content">
            <header class="admin-layout__header">
                <!-- Trigger solo-mobile: en desktop el colapso vive únicamente en el sidenav (logo). -->
                <button type="button"
                    class="admin-layout__icon-btn admin-layout__mobile-nav-btn"
                    *ngIf="isMobile"
                    (click)="sidenav.toggle()"
                    [attr.aria-expanded]="sidenav.opened"
                    aria-label="Menú de navegación"
                    matTooltip="Menú">
                    <i class="ph" [class.ph-x]="sidenav.opened" [class.ph-list]="!sidenav.opened" aria-hidden="true"></i>
                </button>

                <nav class="admin-layout__breadcrumb" aria-label="Ruta de navegación">
                    <i class="ph ph-{{ sectionIcon }} admin-layout__breadcrumb-icon" aria-hidden="true"></i>
                    <a routerLink="/dashboard/home" class="admin-layout__breadcrumb-home">Inicio</a>
                    <ng-container *ngFor="let crumb of breadcrumbTrail; let last = last">
                        <i class="ph ph-caret-right admin-layout__breadcrumb-sep" aria-hidden="true"></i>
                        <span class="admin-layout__breadcrumb-crumb" [class.is-current]="last">{{ crumb }}</span>
                    </ng-container>
                </nav>

                <span class="admin-layout__header-spacer"></span>

                <div class="admin-layout__header-actions">
                    <ng-container *ngTemplateOutlet="chrome.actions$ | async"></ng-container>
                </div>
            </header>

            <div class="admin-layout__page">
                <div class="admin-layout__panel">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
