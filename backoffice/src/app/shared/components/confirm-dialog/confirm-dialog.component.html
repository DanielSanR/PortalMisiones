<div class="confirm-dialog">
    <div class="confirm-dialog__header">
        <div class="confirm-dialog__icon-wrapper">
            <mat-icon>{{ data.confirmText === 'Eliminar' ? 'warning_amber' : 'help_outline' }}</mat-icon>
        </div>
        <h2>{{ data.title }}</h2>
    </div>
    <mat-dialog-content>
        <p>{{ data.message }}</p>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button [disabled]="ejecutando" (click)="dialogRef.close(false)">
            {{ data.cancelText || 'Cancelar' }}
        </button>
        <button mat-flat-button [color]="data.confirmText === 'Eliminar' ? 'warn' : 'primary'"
            [disabled]="ejecutando"
            [attr.aria-busy]="ejecutando"
            (click)="confirmar()">
            <mat-spinner *ngIf="ejecutando" diameter="18"></mat-spinner>
            <span>{{ ejecutando ? (data.busyText || 'Procesando...') : (data.confirmText || 'Confirmar') }}</span>
        </button>
    </mat-dialog-actions>
</div>
