<div class="confirm-dialog" [class.confirm-dialog--danger]="esDestructivo">
    <div class="confirm-dialog__header">
        <div class="confirm-dialog__icon-wrapper">
            <i class="ph" [class.ph-warning]="esDestructivo" [class.ph-question]="!esDestructivo"
               aria-hidden="true"></i>
        </div>
        <div class="confirm-dialog__body">
            <h3 class="confirm-dialog__title">{{ data.title }}</h3>
            <p class="confirm-dialog__message">
                <ng-container *ngFor="let parte of partes">
                    <b *ngIf="parte.destacado">{{ parte.texto }}</b>
                    <ng-container *ngIf="!parte.destacado">{{ parte.texto }}</ng-container>
                </ng-container>
            </p>
        </div>
    </div>
    <mat-dialog-actions align="end">
        <button mat-stroked-button color="primary" [disabled]="ejecutando" (click)="dialogRef.close(false)">
            {{ data.cancelText || 'Cancelar' }}
        </button>
        <button mat-flat-button [color]="esDestructivo ? 'warn' : 'primary'"
            [disabled]="ejecutando"
            [attr.aria-busy]="ejecutando"
            (click)="confirmar()">
            <mat-spinner *ngIf="ejecutando" diameter="18"></mat-spinner>
            <span>{{ ejecutando ? (data.busyText || 'Procesando...') : (data.confirmText || 'Confirmar') }}</span>
        </button>
    </mat-dialog-actions>
</div>
