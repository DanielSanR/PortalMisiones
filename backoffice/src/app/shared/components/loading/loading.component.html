<div class="loading" *ngIf="loading && variant === 'spinner'" role="status">
    <mat-spinner [diameter]="diameter" [attr.aria-label]="message || 'Cargando'"></mat-spinner>
    <p *ngIf="message">{{ message }}</p>
</div>

<ng-container *ngIf="loading && variant === 'skeleton'">
<span class="cdk-visually-hidden" role="status">{{ message || 'Cargando…' }}</span>
<div class="loading-skeleton" aria-hidden="true">
    <div class="loading-skeleton__row" *ngFor="let r of rowsArray">
        <span class="loading-skeleton__avatar"></span>
        <span class="loading-skeleton__bar loading-skeleton__bar--lg"></span>
        <span class="loading-skeleton__bar loading-skeleton__bar--sm"></span>
    </div>
</div>
</ng-container>
