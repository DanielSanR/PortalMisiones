<div class="form-actions" [class.form-actions--integrada]="integrada">
  <div class="form-actions__info">
    <ng-content select="[formActionsInfo]"></ng-content>
  </div>
  @if (helpText) {
    <span class="form-actions__help">{{ helpText }}</span>
  }
  <div class="form-actions__buttons">
    <button mat-stroked-button color="primary" type="button" [disabled]="saving" (click)="cancelar.emit()">
      {{ cancelText }}
    </button>
    <span class="form-actions__submit">
      <!-- UN solo botón que alterna su estado: si "sin cambios" lo reemplazara por otro nodo, al guardar y
           quedarse en la página el botón enfocado se destruiría y el foco caería a `body` (WCAG 2.4.3).
           Edición sin cambios: no es un `disabled` mudo; sigue enfocable y el motivo aparece al pasar el mouse,
           al enfocarlo y al tocarlo (`appUnavailable`, que además anula el envío). -->
      <button mat-flat-button color="primary" type="submit"
              [appUnavailable]="bloqueadoSinCambios ? 'No hay cambios para guardar' : false"
              [attr.aria-busy]="saving || null" [disabled]="saving">
        @if (saving) {
          <i class="ph ph-spinner-gap spin" aria-hidden="true"></i>
        } @else {
          <i class="ph ph-floppy-disk" aria-hidden="true"></i>
        }
        <span>{{ saving ? savingText : submitText }}</span>
      </button>
    </span>
  </div>
</div>
