@if (tabs.length >= 2) {
  <div class="filter-tabs" role="radiogroup" aria-label="Filtros de la lista" (keydown)="onKeydown($event)">
    @for (tab of tabs; track tab.value; let i = $index) {
      <button type="button"
          #tabBtn
          class="filter-tabs-tab"
          role="radio"
          [class.is-active]="tab.value === active"
          [attr.aria-checked]="tab.value === active"
          [tabindex]="tab.value === active ? 0 : -1"
          (click)="select(tab.value)">
        <span>{{ tab.label }}</span>
        @if (tab.count !== undefined) {
          <span class="filter-tabs-tab-count">{{ tab.count }}</span>
        }
        @if (tab.alert) {
          <span class="filter-tabs-tab-dot" aria-hidden="true"></span>
        }
      </button>
    }
  </div>
}
