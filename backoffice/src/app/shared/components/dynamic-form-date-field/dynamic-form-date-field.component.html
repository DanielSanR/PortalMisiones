<!-- Grupo propio: @Host del `formControlName` no ve el `formGroup` del componente padre. -->
<ng-container [formGroup]="group">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <input matInput
           [id]="field.name"
           [attr.aria-labelledby]="field.name + '-label'"
           [matDatepicker]="picker"
           [formControlName]="field.name"
           [min]="minimo$ | async"
           [placeholder]="field.placeholder || 'DD/MM/AAAA'"
           autocomplete="off"
           [required]="field.validations?.required || false">
    <mat-datepicker-toggle matIconSuffix [for]="picker" [attr.aria-label]="field.fecha?.botonCalendario || 'Elegir fecha'">
      <i matDatepickerToggleIcon class="ph ph-calendar-blank" aria-hidden="true"></i>
    </mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
    @if (field.hint) {
      <mat-hint align="start">{{ field.hint }}</mat-hint>
    }
    <mat-error appFormErrorMessage [control]="group.get(field.name)" [field]="field"></mat-error>
  </mat-form-field>
  @if (field.fecha?.quitar; as quitar) {
    @if (conFecha$ | async) {
      <button type="button" class="date-field__quitar" (click)="vaciar()">
        <i class="ph ph-x" aria-hidden="true"></i> {{ quitar }}
      </button>
    }
  }
</ng-container>
