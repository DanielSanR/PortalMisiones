<!-- Esc en el grupo entero: cierra también con el foco en el botón, no solo dentro de la lista. -->
<div class="seleccion-multiple perm-group" role="group" [attr.aria-labelledby]="idEtiqueta"
     (keydown.escape)="onEscape($event)">

  <div class="seleccion-multiple__encabezado perm-group__header">
    <span class="perm-group__label" [id]="idEtiqueta">{{ etiqueta }}</span>
    <span class="perm-group__count">{{ contador }}</span>
    <button #alternar type="button" class="seleccion-multiple__alternar" [disabled]="disabled"
            [attr.aria-expanded]="abierto" [attr.aria-controls]="abierto ? idPanel : null" [attr.aria-label]="ariaAlternar"
            (click)="onAlternar()">
      <i class="ph" [ngClass]="iconoAlternar" aria-hidden="true"></i>
      {{ etiquetaAlternar }}
    </button>
  </div>

  @if (elegidas.length) {
    <ul class="seleccion-multiple__chips perm-group__chips">
      @for (op of chips; track op.id) {
        <!-- El chip entero es el botón de quitar (como los chips de permisos del Rol): el hover y el foco
             son del chip, no solo de la "×". -->
        <li class="seleccion-multiple__item">
          <button type="button" class="seleccion-multiple__chip seleccion-multiple__quitar perm-chip perm-chip--granted perm-chip--toggle"
                  [disabled]="disabled" [attr.aria-label]="'Quitar ' + op.nombre" (click)="quitar(op.id)">
            {{ op.nombre }}
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
        </li>
      }
      @if (ocultas) {
        <li class="seleccion-multiple__mas">
          <button type="button" class="perm-chip perm-chip--toggle" [disabled]="disabled"
                  [attr.aria-expanded]="abierto" [attr.aria-controls]="abierto ? idPanel : null"
                  [attr.aria-label]="'+' + ocultas + ' más, ' + (abierto ? 'cerrar' : 'abrir') + ' la lista de ' + nombre"
                  (click)="onAlternar()">
            +{{ ocultas }} más
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="seleccion-multiple__vacio">{{ textoVacio }}</p>
  }

  @if (abierto) {
    <!-- Enter no sale del panel: el grupo vive dentro de un <form> y, sin esto, Enter en el buscador o en
         una casilla dispararía el envío implícito y guardaría el formulario. -->
    <div class="seleccion-multiple__panel" [id]="idPanel" (keydown.enter)="$event.preventDefault()">
      @if (buscable) {
        <div class="seleccion-multiple__buscador">
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <input type="search" class="seleccion-multiple__busqueda" autocomplete="off"
                 [attr.aria-label]="'Buscar en ' + nombre" [placeholder]="'Buscar entre ' + opciones.length + '…'"
                 [value]="consulta" (input)="onBuscar($any($event.target).value)">
        </div>
      }
      <div class="seleccion-multiple__lista">
        @for (op of filtradas; track op.id) {
          <mat-checkbox class="seleccion-multiple__opcion" color="primary" [class.is-marcada]="marcada(op.id)"
                        [checked]="marcada(op.id)" [disabled]="disabled" (change)="alternarOpcion(op.id)">
            {{ op.nombre }}
          </mat-checkbox>
        }
        @if (sinResultados) {
          <p class="seleccion-multiple__sin-resultados" role="status">{{ textoSinResultados }}</p>
        }
      </div>
    </div>
  }

  <ng-content></ng-content>
</div>
