<!-- ====================================================================== -->
<!-- SharedTableComponent — Template                                        -->
<!-- Tabla reutilizable basada en MatTable con soporte para:                -->
<!-- - Columnas configurables (texto simple o template personalizado)        -->
<!-- - Ordenamiento (MatSort) opcional por columna, indicador Phosphor      -->
<!-- - Paginacion server-side (MatPaginator) opcional                       -->
<!-- - Skeleton (carga inicial) · Empty state · Error state                 -->
<!-- ====================================================================== -->

<div class="shared-table" [class.shared-table--striped]="striped">

  <!-- Loading — barra fina cuando ya hay datos previos en pantalla -->
  <mat-progress-bar *ngIf="loading && data && data.length > 0" mode="indeterminate" class="shared-table__loader"
    aria-label="Cargando datos">
  </mat-progress-bar>

  <!-- Carga inicial: el skeleton es aria-hidden, así que un lector de pantalla necesita este texto vivo. -->
  <span class="cdk-visually-hidden" role="status" *ngIf="showSkeleton">Cargando…</span>

  <!-- Table / Skeleton -->
  <div class="shared-table__wrapper" [class.shared-table__wrapper--loading]="loading && data && data.length > 0"
    *ngIf="showTable">
    <table mat-table [dataSource]="data" matSort (matSortChange)="onSortChange($event)"
      class="shared-table__mat-table">

      <!-- Dynamic columns -->
      <ng-container *ngFor="let column of columns" [matColumnDef]="column.key">

        <!-- Header cell -->
        <th mat-header-cell *matHeaderCellDef mat-sort-header [disabled]="!column.sortable || !sortable"
          [ngClass]="column.headerClass" [class.shared-table__cell--hide-mobile]="column.hideOnMobile"
          [style.width]="column.width">

          <!-- Custom header template o texto simple -->
          <ng-container *ngIf="getHeaderTemplate(column) as headerTpl; else defaultHeader">
            <ng-container *ngTemplateOutlet="headerTpl; context: { $implicit: column }"></ng-container>
          </ng-container>
          <ng-template #defaultHeader>
            <span class="shared-table__th">
              <span>{{ column.label }}</span>
              <i class="ph ph-arrow-up shared-table__sort-icon" aria-hidden="true"
                *ngIf="sortable && column.sortable && sort?.active === column.key"
                [class.shared-table__sort-icon--desc]="sort?.direction === 'desc'"></i>
            </span>
          </ng-template>
        </th>

        <!-- Data cell -->
        <td mat-cell *matCellDef="let row" [ngClass]="column.cellClass"
          [class.shared-table__cell--hide-mobile]="column.hideOnMobile" [style.width]="column.width">

          <!-- Custom cell template o valor de texto simple -->
          <ng-container *ngIf="getCellTemplate(column) as cellTpl; else defaultCell">
            <ng-container *ngTemplateOutlet="cellTpl; context: { $implicit: row, column: column }"></ng-container>
          </ng-container>
          <ng-template #defaultCell>{{ getCellValue(row, column.key) }}</ng-template>
        </td>
      </ng-container>

      <!-- Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <!-- Solo la fila clickable es focusable (tabindex) y se activa con Enter/Espacio; la fila
           seleccionada se anuncia con aria-current (aria-selected no aplica a role=row de una tabla). -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="onRowClick(row)"
        [class.shared-table__row--clickable]="rowClick.observed"
        [class.shared-table__row--selected]="rowIsSelected(row)"
        [attr.tabindex]="rowClick.observed ? 0 : null"
        [attr.aria-current]="rowIsSelected(row) ? 'true' : null"
        (keydown.enter)="onRowKeydown($event, row)" (keydown.space)="onRowKeydown($event, row)">
      </tr>
    </table>

    <!-- Skeleton — filas fantasma mientras se resuelve la carga inicial -->
    <div *ngIf="showSkeleton" aria-hidden="true" role="presentation">
      <div class="shared-table__skeleton-row" *ngFor="let r of skeletonRowsArray">
        <span class="shared-table__skeleton-avatar"></span>
        <div class="shared-table__skeleton-cell" *ngFor="let column of columns"
          [style.width]="column.width" [class.shared-table__cell--hide-mobile]="column.hideOnMobile">
          <span class="shared-table__skeleton-bar"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty state — clases globales `.state-panel*` (_components.scss) -->
  <div class="state-panel" *ngIf="showEmpty" role="status">
    <img *ngIf="emptyImage" [src]="emptyImage" alt="" class="shared-table__state-image" aria-hidden="true" />
    <span *ngIf="!emptyImage" class="state-panel__icon" aria-hidden="true">
      <i class="ph ph-{{ emptyIcon }}"></i>
    </span>
    <p class="state-panel__title">{{ emptyTitle || emptyMessage }}</p>
    <p class="state-panel__text" *ngIf="emptyTitle && emptyMessage">{{ emptyMessage }}</p>
    <!-- El CTA no se dibuja si el usuario no puede ejecutarlo: el estado vacío no debe
         invitar a crear algo que el backend le va a rechazar. Sin `emptyActionPermission`
         se muestra siempre, que es el caso de los CTA que solo limpian filtros. -->
    <button *ngIf="emptyActionLabel && (puedeAccionar$ | async)" type="button" mat-raised-button color="primary"
      class="state-panel__cta" (click)="emptyAction.emit()">
      <i class="ph ph-{{ emptyActionIcon }}" aria-hidden="true"></i>{{ emptyActionLabel }}
    </button>
  </div>

  <!-- Error state -->
  <div class="state-panel" *ngIf="showError" role="alert">
    <span class="state-panel__icon state-panel__icon--error" aria-hidden="true">
      <i class="ph ph-cloud-slash"></i>
    </span>
    <p class="state-panel__title">{{ errorTitle }}</p>
    <p class="state-panel__text">{{ errorMessage }}</p>
    <button type="button" mat-stroked-button color="primary" class="state-panel__cta"
      (click)="retry.emit()">
      <i class="ph ph-arrow-clockwise" aria-hidden="true"></i>{{ errorRetryLabel }}
    </button>
  </div>

  <!-- Paginador propio del design system (Kitchen Sink §05): rango a la izquierda,
       carets y chips numerados a la derecha. Sin selector de tamaño de página. -->
  <nav class="shared-table__paginador" *ngIf="paginated && showTable && !showSkeleton"
    aria-label="Paginación de la tabla">
    <span class="shared-table__paginador-rango" aria-live="polite" aria-atomic="true">{{ rangoTexto }}</span>

    <div class="shared-table__paginador-controles">
      <button type="button" class="shared-table__pagina shared-table__pagina--nav"
        [disabled]="pageIndex <= 0" (click)="irAPagina(pageIndex - 1)" aria-label="Página anterior">
        <i class="ph ph-caret-left" aria-hidden="true"></i>
      </button>

      <ng-container *ngFor="let pagina of paginas">
        <span *ngIf="pagina === null" class="shared-table__paginador-elipsis" aria-hidden="true">…</span>
        <button *ngIf="pagina !== null" type="button" class="shared-table__pagina"
          [class.is-active]="pagina === pageIndex"
          [attr.aria-current]="pagina === pageIndex ? 'page' : null"
          [attr.aria-label]="'Página ' + (pagina + 1)"
          (click)="irAPagina(pagina)">{{ pagina + 1 }}</button>
      </ng-container>

      <button type="button" class="shared-table__pagina shared-table__pagina--nav"
        [disabled]="pageIndex >= ultimaPagina" (click)="irAPagina(pageIndex + 1)" aria-label="Página siguiente">
        <i class="ph ph-caret-right" aria-hidden="true"></i>
      </button>
    </div>
  </nav>

</div>
