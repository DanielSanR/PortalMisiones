<form class="dynamic-form" [formGroup]="form" (ngSubmit)="submit()" *ngIf="form">
  <!-- El error del servidor queda a la vista hasta el próximo intento: el diálogo global
       se cierra y el usuario se queda sin el motivo del fallo. -->
  <app-form-error-banner *ngIf="serverError" [errors]="[serverError]"
                         titulo="No se pudo guardar"></app-form-error-banner>
  <app-form-error-banner *ngIf="submitted" [errors]="invalidFieldMessages()"></app-form-error-banner>

  <div class="form-fields">
    <div *ngFor="let field of fields"
         class="form-field"
         [ngClass]="getFieldCssClass(field)">
      <label *ngIf="showExternalLabel(field)"
             class="form-field__label"
             [id]="field.name + '-label'"
             [attr.for]="field.name">
        {{ field.label }}<span *ngIf="field.validations?.required" class="form-field__required" aria-hidden="true"> *</span><span *ngIf="!field.validations?.required" class="form-field__optional"> (opcional)</span>
      </label>
      <app-dynamic-form-field
        [field]="field"
        [group]="form">
      </app-dynamic-form-field>
      <!-- Una sola marca para todos los tipos de campo, en vez de repetirla por variante. -->
      <span *ngIf="field.pendiente" class="form-field__pendiente">
        <i class="ph ph-clock" aria-hidden="true"></i>
        Campo de ejemplo, no persiste.
      </span>
    </div>
  </div>

  <div class="form-actions" *ngIf="!hideButtons">
    <span class="form-actions__help">{{ helpText }}</span>
    <div class="form-actions__buttons">
      <button mat-stroked-button color="primary" type="button"
              [disabled]="saving"
              (click)="formCancel.emit()">
        {{ cancelButtonText }}
      </button>
      <button mat-raised-button color="primary"
              type="submit"
              [disabled]="saving || (requireChanges && form.pristine)"
              [matTooltip]="requireChanges && form.pristine ? 'No hay cambios para guardar' : ''">
        <mat-spinner *ngIf="saving" diameter="20"></mat-spinner>
        <ng-container *ngIf="!saving">
          <i class="ph ph-floppy-disk" aria-hidden="true"></i>
          <span>{{ submitButtonText }}</span>
        </ng-container>
      </button>
    </div>
  </div>
</form>
