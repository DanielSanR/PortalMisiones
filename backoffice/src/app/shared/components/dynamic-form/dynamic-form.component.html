<form class="dynamic-form" [class.dynamic-form--compacto]="compacto" [attr.id]="formId || null"
      [formGroup]="form" (ngSubmit)="submit()" *ngIf="form">
  <!-- El error del servidor queda a la vista hasta el próximo intento: el diálogo global
       se cierra y el usuario se queda sin el motivo del fallo. Un envío inválido ES el próximo intento:
       el error del guardado anterior ya no describe lo que pasa y le cede el lugar al resumen. -->
  <app-form-error-banner *ngIf="serverError && !submitted" [errors]="[serverError]"
                         titulo="No se pudo guardar"></app-form-error-banner>
  <!-- Resumen de validación: sin role=alert (los mat-error de cada campo ya se anuncian) y con
       foco al enviar, para no duplicar anuncios. -->
  <app-form-error-banner #resumen *ngIf="submitted" [live]="false" [errors]="invalidFieldMessages()"></app-form-error-banner>

  <div class="form-fields">
    <ng-container *ngFor="let field of fields; trackBy: trackByName">
    <div *ngIf="seDibuja(field)"
         class="form-field"
         [ngClass]="getFieldCssClass(field)">
      <label *ngIf="showExternalLabel(field)"
             class="form-field__label"
             [id]="field.name + '-label'"
             [attr.for]="field.name">
        {{ field.label }}<span *ngIf="field.validations?.required && !field.readonly" class="form-field__required" aria-hidden="true"> *</span>
      </label>
      <app-dynamic-form-field
        [field]="field"
        [group]="form"
        [nivelEncabezado]="compacto ? 3 : 2"
        [revision]="revision">
      </app-dynamic-form-field>
      <!-- Una sola marca para todos los tipos de campo, en vez de repetirla por variante. -->
      <span *ngIf="field.pendiente" class="form-field__pendiente">
        <i class="ph ph-clock" aria-hidden="true"></i>
        Campo de ejemplo, no persiste.
      </span>
    </div>
    </ng-container>
  </div>

  <!-- Widgets propios de la página, atados a campos `custom` (ver `FieldConfig.type`). -->
  <ng-content></ng-content>

  <app-form-actions *ngIf="!hideButtons"
                    [helpText]="helpText"
                    [cancelText]="cancelButtonText"
                    [submitText]="submitButtonText"
                    [savingText]="savingButtonText"
                    [saving]="saving"
                    [sinCambios]="sinCambios"
                    (cancelar)="formCancel.emit()">
  </app-form-actions>
</form>
