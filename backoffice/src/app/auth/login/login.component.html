<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <img src="assets/images/logo-misiones.png" alt="Misiones" class="auth-card__logo" />
      <h1>Portal de Trámites</h1>
      <p>Backoffice de Administración</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-card__form" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="usuario@misiones.gob.ar" autocomplete="email" />
        <mat-icon matSuffix>email</mat-icon>
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email requerido</mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Email inválido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'" autocomplete="current-password" />
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
                [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Contraseña requerida</mat-error>
      </mat-form-field>

      <p *ngIf="errorMessage" class="auth-card__error" role="alert">{{ errorMessage }}</p>

      <button mat-raised-button color="primary" type="submit"
              [disabled]="loading || loginForm.invalid"
              class="auth-card__submit">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">Iniciar sesión</span>
      </button>
    </form>

    <a routerLink="/auth/forgot-password" class="auth-card__link">
      ¿Olvidaste tu contraseña?
    </a>
  </div>
</div>
