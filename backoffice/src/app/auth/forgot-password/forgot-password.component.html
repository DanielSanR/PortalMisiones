<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <img src="assets/images/logo-misiones.png" alt="Misiones" class="auth-card__logo" />
      <h1>Recuperar contraseña</h1>
      <p>Ingresá tu email y te enviamos las instrucciones</p>
    </div>

    <ng-container *ngIf="!successMessage; else panelExito">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card__form" novalidate>
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input
            matInput
            formControlName="email"
            type="email"
            placeholder="usuario@misiones.gob.ar"
            autocomplete="email"
          />
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email requerido</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <p *ngIf="errorMessage" class="auth-card__error" role="alert">{{ errorMessage }}</p>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loading || form.invalid"
          class="auth-card__submit"
          aria-label="Enviar instrucciones de recuperación"
        >
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">Enviar instrucciones</span>
        </button>
      </form>
    </ng-container>

    <ng-template #panelExito>
      <p class="auth-card__success" role="status">{{ successMessage }}</p>
    </ng-template>

    <a routerLink="/auth/login" class="auth-card__link">
      <mat-icon>arrow_back</mat-icon>
      Volver al login
    </a>
  </div>
</div>
