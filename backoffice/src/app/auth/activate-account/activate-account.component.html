<app-auth-shell titulo="Activación de cuenta">
  @switch (estado) {
    @case ('activando') {
      <div class="activate__estado" role="status">
        <mat-spinner diameter="40" aria-hidden="true"></mat-spinner>
        <p class="activate__texto">Activando tu cuenta…</p>
      </div>
    }
    @case ('ok') {
      <p class="auth-notice auth-notice--success" role="status">
        <i class="ph ph-check-circle auth-notice__icon" aria-hidden="true"></i>
        <span>¡Cuenta activada! Te estamos redirigiendo al panel…</span>
      </p>
      <a routerLink="/dashboard/home" class="auth-link">Ir al panel ahora</a>
    }
    @case ('error') {
      <div class="form-error-banner auth-banner" role="alert">
        <i class="ph ph-warning-circle form-error-banner__icon" aria-hidden="true"></i>
        <div class="form-error-banner__body">
          <span class="form-error-banner__title">No pudimos activar tu cuenta</span>
          <span class="form-error-banner__detail">{{ errorMessage }}</span>
        </div>
      </div>
      <div class="activate__acciones">
        <button type="button" class="auth-link" appUnavailable="Pedir un nuevo enlace llega en una próxima versión. Por ahora, solicitalo a quien administra tu organismo.">
          <i class="ph ph-envelope-simple" aria-hidden="true"></i>
          Pedir un nuevo enlace
        </button>
        <a routerLink="/auth/login" class="auth-link">
          <i class="ph ph-arrow-left" aria-hidden="true"></i>
          Volver al inicio de sesión
        </a>
      </div>
    }
  }
</app-auth-shell>
